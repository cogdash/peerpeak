repos:
  - repo: local
    hooks:
      - id: forbid-main
        name: Forbid commits to main
        entry: .githooks/prevent-main-commit.sh
        language: script
        always_run: true

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types:
          - yaml
