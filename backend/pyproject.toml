[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "peerpeak-backend"
version = "0.1.0"
description = "Peerpeak Frontend"
authors = [
    { name = "Reeliks", email = "reeeeeliks@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.143.0",
    "greenlet>=3.0.0",
    "grpcio-tools>=1.84.0",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.2.1",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false
