{% extends "base.html" %}

{% block styles %}
    <link rel="stylesheet" href="/static/css/profile.css">
    <link rel="stylesheet" href="/static/css/badge.css">
{% endblock %}

{% block body_attrs %}x-data="badgePage"{% endblock %}

{% block content %}
    <div class="badge-page">

      <button type="button" class="back-link" @click="goBack()">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"></path>
          <path d="M12 19l-7-7 7-7"></path>
        </svg>
        <span>Назад</span>
      </button>

      <main class="badge-stage">
        <div class="empty" x-show="loading" x-cloak>
          <div class="big">⏳</div>
          <div>Загружаем значок…</div>
        </div>

        <div class="empty" x-show="error" x-cloak>
          <div class="big">🏅</div>
          <div x-text="error"></div>
        </div>

        <!-- Одна карточка — ровно такая же, как в профиле. -->
        <div class="badge-list" x-show="badge" x-cloak>
          <article class="badge" :class="badgeClass" @pointerdown="startPress($event)">
            <div class="badge-ico" x-text="badge ? (badge.emoji || '🏅') : ''"></div>

            <div class="badge-body">
              <p class="badge-text" x-text="badge ? badge.title : ''"></p>
              <p class="badge-meta">
                <span class="kind" x-text="kindLabel"></span>

                <span class="badge-date"
                      x-show="myBadge && myBadge.received && myBadge.received_at"
                      :title="myBadge && myBadge.received_at ? 'Получен: ' + receivedDateFull(myBadge.received_at) : ''"
                      x-text="myBadge && myBadge.received_at ? '📆 ' + receivedDate(myBadge.received_at) : ''"></span>
              </p>
            </div>

            <div class="badge-tail">
              <span class="badge-status ok"
                    x-show="myBadge && myBadge.received"
                    title="У вас получен">✅</span>
              <span class="badge-status added"
                    x-show="myBadge && !myBadge.received"
                    title="У вас на странице">📎</span>

              <div class="badge-actions">
                <!-- Получен у меня → отменить получение, как в профиле. -->
                <button type="button" class="icon-btn cancel"
                        x-show="myBadge && myBadge.received"
                        title="Отменить получение у себя" aria-label="Отменить получение у себя"
                        @click="unreceiveBadge()">
                  <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
                       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 6l12 12M18 6L6 18"/>
                  </svg>
                </button>

                <!-- Есть у меня, но не получен → убрать со страницы. -->
                <button type="button" class="icon-btn danger"
                        x-show="myBadge && !myBadge.received"
                        title="Убрать со своей страницы" aria-label="Убрать со своей страницы"
                        @click="removeBadge()">
                  <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
                       stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18"/><path d="M8 6V4h8v2"/>
                    <path d="M6 6l1 14h10l1-14"/><path d="M10 11v6M14 11v6"/>
                  </svg>
                </button>

                <!-- Ещё нет на моей странице → добавить. -->
                <button type="button" class="icon-btn add"
                        x-show="me && !myBadge"
                        title="Добавить к себе" aria-label="Добавить к себе"
                        @click="addBadge()">
                  <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
                       stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 5v14M5 12h14"/>
                  </svg>
                </button>
              </div>
            </div>
          </article>
        </div>
      </main>

    </div>
{% endblock %}

{% block scripts %}
    <script src="/static/js/badge.js"></script>
{% endblock %}
