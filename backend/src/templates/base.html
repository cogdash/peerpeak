<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Peerpeak{% endblock %}</title>

    {% block meta %}{% endblock %}

    <link rel="stylesheet" href="/static/css/base.css">
    {% block styles %}{% endblock %}
  </head>
  <body {% block body_attrs %}{% endblock %}>

    <div class="wrap">
      {% block header %}{% if user %}{% include "_header.html" %}{% endif %}{% endblock %}
      {% block content %}{% endblock %}
    </div>

    {% block overlays %}{% endblock %}

    <div id="toast" role="status" aria-live="polite"
         :class="{ show: $store.toast.visible }"
         x-text="$store.toast.message"></div>

    <!-- Компоненты регистрируются до запуска Alpine (он стартует сразу
         после загрузки), поэтому скрипты идут перед alpine.min.js. -->
    <script src="/static/js/shared.js"></script>
    {% block scripts %}{% endblock %}
    <script src="/static/vendor/alpine.min.js"></script>

  </body>
</html>
