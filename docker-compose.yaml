services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: peerpeak-app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/peerpeak
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_BUCKET_NAME=peerpeak-user-content
      - S3_REGION=us-east-1
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - peerpeak-network
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: peerpeak-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=peerpeak
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - peerpeak-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: peerpeak-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    networks:
      - peerpeak-network
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: peerpeak-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - peerpeak-network
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:

networks:
  peerpeak-network:
    driver: bridge
