services:
  peerpeak-backend:
    container_name: peerpeak-backend
    build: ./backend/
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://peerpeak:peerpeak@peerpeak-database:5432/peerpeak
    ports:
      - 8090:8090
    networks: [peerpeak]

  peerpeak-classifier:
    container_name: peerpeak-classifier
    build: ./ach-classifier
    restart: unless-stopped
    ports: 
      - 8000:8000
    networks: [peerpeak]

  peerpeak-database:
    container_name: peerpeak-database   
    image: postgres:16
    environment:
      POSTGRES_USER: peerpeak
      POSTGRES_PASSWORD: peerpeak
      POSTGRES_DB: peerpeak
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peerpeak"]
      interval: 3s
      retries: 20

networks:
  peerpeak:
