services:
  peerpeak-backend:
    container_name: peerpeak-backend
    restart: unless-stopped
    build: 
      context: .
      dockerfile: ./backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://peerpeak:peerpeak@peerpeak-database:5432/peerpeak
      GRPC_TARGET: peerpeak-classifier:50051
    ports:
      - 8090:8090
    networks: [peerpeak]

  peerpeak-classifier:
    container_name: peerpeak-classifier
    build: 
      context: .
      dockerfile: ./ach-classifier/Dockerfile
    restart: unless-stopped
    networks: [peerpeak]

