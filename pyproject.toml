[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "peerpeak"
version = "0.1.0"
description = "Achievement sharing app used as a DevOps playground."
readme = "README.md"
requires-python = ">=3.13"
authors = [
  { name = "Maksim Panov", email = "mxm@pnv.life" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License"
]
dependencies = [
    "fastapi[standard]>=0.140.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.19.0",
    "jinja2>=3.1.6",
    "uvicorn>=0.51.0",
    "python-dotenv>=1.0.0",
    "passlib[bcrypt]<1.7.4",
    "bcrypt<5.0.0",
    "boto3>=1.35.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pylint>=4.0.6",
]

[project.scripts]
peerpeak = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
