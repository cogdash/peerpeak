<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - PeerPeak</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <h1 class="auth-logo">PeerPeak</h1>
        <p class="auth-subtitle">Create your account to get started.</p>

        <div x-data="{ showPassword: false, error: {{ error | tojson }} }">
            <template x-if="error">
                <div class="auth-error-message" x-text="error"></div>
            </template>

            <form method="POST" action="/signup">
                <div class="auth-form-group">
                    <label class="auth-form-label" for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="auth-form-input"
                        placeholder="Choose a username"
                        required
                        autocomplete="username"
                        minlength="3"
                        maxlength="30"
                    >
                </div>

                <div class="auth-form-group">
                    <label class="auth-form-label" for="password">Password</label>
                    <div class="password-input-wrapper">
                        <input
                            :type="showPassword ? 'text' : 'password'"
                            id="password"
                            name="password"
                            class="auth-form-input"
                            placeholder="Create a password"
                            required
                            autocomplete="new-password"
                            minlength="8"
                        >
                        <button
                            type="button"
                            class="password-toggle"
                            @click="showPassword = !showPassword"
                        >
                            <span x-show="!showPassword">👁️</span>
                            <span x-show="showPassword">🙈</span>
                        </button>
                    </div>
                </div>

                <div class="auth-form-group">
                    <label class="auth-form-label" for="display_name">Display Name (optional)</label>
                    <input
                        type="text"
                        id="display_name"
                        name="display_name"
                        class="auth-form-input"
                        placeholder="How you'd like to be shown"
                        maxlength="100"
                        autocomplete="name"
                    >
                </div>

                <button type="submit" class="auth-btn-primary">Create Account</button>
            </form>

            <p class="auth-footer">
                Already have an account? <a href="/login">Sign in</a>
            </p>
        </div>
    </div>
</body>
</html>
